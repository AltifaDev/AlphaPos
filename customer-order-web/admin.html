<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaPos | Supabase VPS Controller</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(22, 27, 45, 0.7);
            --primary: #2d71f8;
            --primary-glow: rgba(45, 113, 248, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --console-bg: #07080d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract glowing background circles */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.4;
        }
        body::before {
            background: var(--primary);
            top: -100px;
            left: -100px;
        }
        body::after {
            background: #a855f7;
            bottom: -100px;
            right: -100px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 25px 60px rgba(45, 113, 248, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Status Indicator Card */
        .status-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--text-muted);
            box-shadow: 0 0 0 4px rgba(156, 156, 156, 0.15);
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: var(--success);
            box-shadow: 0 0 15px 4px var(--success-glow);
            animation: pulse-green 2s infinite;
        }

        .status-dot.offline {
            background-color: var(--danger);
            box-shadow: 0 0 15px 4px var(--danger-glow);
            animation: pulse-red 2s infinite;
        }

        .status-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .status-url {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Control Buttons */
        .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .actions-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 16px 24px;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            outline: none;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            background: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Live Terminal Console */
        .console-container {
            background-color: var(--console-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .console-header {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .console-dots {
            display: flex;
            gap: 6px;
        }

        .console-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #334155;
        }

        .console-dot.red { background-color: var(--danger); }
        .console-dot.yellow { background-color: #eab308; }
        .console-dot.green { background-color: var(--success); }

        .console-body {
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #38bdf8; /* cyber blue console text */
            scroll-behavior: smooth;
        }

        .console-line {
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(8px);
            animation: console-fade-in 0.3s forwards cubic-bezier(0, 0, 0.2, 1);
        }

        .console-line.input { color: #f472b6; }
        .console-line.success { color: var(--success); }
        .console-line.error { color: var(--danger); }
        .console-line.info { color: var(--text-muted); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--primary);
        }

        /* Animations */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes console-fade-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        .console-body::-webkit-scrollbar {
            width: 8px;
        }
        .console-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .console-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .console-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AlphaPos Cloud Control</h1>
            <p>Supabase VPS Master Database Management</p>
        </header>

        <!-- Status Card -->
        <div class="status-card">
            <div class="status-info">
                <div id="statusDot" class="status-dot"></div>
                <div>
                    <div id="statusLabel" class="status-label">Checking VPS Connection...</div>
                    <div id="statusUrl" class="status-url">https://api.alphaposweb.com</div>
                </div>
            </div>
            <button class="btn" style="padding: 8px 16px; font-size: 0.85rem;" onclick="checkHealth()">Refresh</button>
        </div>

        <!-- Action Panel -->
        <div class="actions-row">
            <button id="btnHealth" class="btn" onclick="checkHealth()">
                <span>🔍</span> Test VPS Health
            </button>
            <button id="btnSeed" class="btn btn-primary" onclick="seedDatabase()">
                <span>⚡</span> Seed Supabase VPS
            </button>
        </div>

        <!-- Terminal Console -->
        <div class="console-container">
            <div class="console-header">
                <div class="console-title">
                    <span style="font-size: 1rem;">💻</span> VPS SQL Console
                </div>
                <div class="console-dots">
                    <span class="console-dot red"></span>
                    <span class="console-dot yellow"></span>
                    <span class="console-dot green"></span>
                </div>
            </div>
            <div id="consoleBody" class="console-body">
                <div class="console-line info">[system] Console initialized. Ready to execute commands.</div>
            </div>
        </div>

        <a href="/" class="back-link">← Back to Ordering Home</a>
    </div>

    <script>
        const consoleBody = document.getElementById('consoleBody');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const statusUrl = document.getElementById('statusUrl');

        const btnHealth = document.getElementById('btnHealth');
        const btnSeed = document.getElementById('btnSeed');

        function appendLog(text, type = '') {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            consoleBody.appendChild(line);
            consoleBody.scrollTop = consoleBody.scrollHeight;
        }

        async function checkHealth(silent = false) {
            if (!silent) {
                appendLog('Testing connection to Supabase VPS...', 'input');
                btnHealth.disabled = true;
            }

            try {
                const response = await fetch('/v1/sync/supabase-health');
                const data = await response.json();

                if (data.online) {
                    statusDot.className = 'status-dot online';
                    statusLabel.textContent = 'VPS Database Connected';
                    statusUrl.textContent = data.url;
                    if (!silent) {
                        appendLog(`Supabase VPS is ONLINE. URL: ${data.url}`, 'success');
                    }
                } else {
                    statusDot.className = 'status-dot offline';
                    statusLabel.textContent = 'Connection Failed';
                    statusUrl.textContent = data.reason || 'Offline';
                    if (!silent) {
                        appendLog(`Supabase VPS is OFFLINE: ${data.reason}`, 'error');
                    }
                }
            } catch (err) {
                statusDot.className = 'status-dot offline';
                statusLabel.textContent = 'Connection Error';
                statusUrl.textContent = err.message;
                if (!silent) {
                    appendLog(`Connection check failed: ${err.message}`, 'error');
                }
            } finally {
                if (!silent) {
                    btnHealth.disabled = false;
                }
            }
        }

        async function seedDatabase() {
            appendLog('Triggered Supabase VPS Database Seeding...', 'input');
            btnSeed.disabled = true;

            try {
                const response = await fetch('/v1/sync/supabase-seed', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    data.logs.forEach(log => {
                        if (log.includes('Failed') || log.includes('error') || log.includes('Fatal')) {
                            appendLog(log, 'error');
                        } else if (log.includes('success') || log.includes('OK') || log.includes('added')) {
                            appendLog(log, 'success');
                        } else {
                            appendLog(log, 'info');
                        }
                    });
                    appendLog('Supabase Seeding procedure completed.', 'success');
                    // Refresh health check to see if still connected
                    checkHealth(true);
                } else {
                    data.logs.forEach(log => appendLog(log, 'error'));
                    appendLog('Seeding process failed. See logs above.', 'error');
                }
            } catch (err) {
                appendLog(`Seeding HTTP post request failed: ${err.message}`, 'error');
            } finally {
                btnSeed.disabled = false;
            }
        }

        // Run connection test on load
        window.addEventListener('DOMContentLoaded', () => {
            checkHealth(true);
        });
    </script>
</body>
</html>
